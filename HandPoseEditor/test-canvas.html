<!DOCTYPE html>
<html><body style="background:#1a1a2e;margin:0">
<canvas id="c" width="800" height="600"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
ctx.fillStyle = 'red';
ctx.fillRect(100, 100, 300, 200);
ctx.fillStyle = 'white';
ctx.font = '24px monospace';
ctx.fillText('Canvas works!', 120, 220);
ctx.fillStyle = 'blue';
ctx.fillRect(450, 100, 200, 200);
ctx.fillStyle = 'green';
ctx.fillRect(100, 350, 600, 100);
</script>
</body></html>
